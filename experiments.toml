# Training knobs (2026-10-08): one change at a time against a fixed 2B baseline at the pilot
# budget, on ChartQA, where responses keep their reasoning and differ in length, so loss and
# length knobs can show. Each knob's final adapter is scored greedily on ChartQA's full dev
# role (960 questions) under both prompts; `expect` was written before the run. The table
# reads + or − only when the interval excludes zero and the change exceeds the repeat's.
# `python -m scripts.knobs commands chartqa` prints the runs; `summarize` writes
# results/knobs-chartqa.json. Run directories and dev records stay local.
[knobs.chartqa]
dataset = "chartqa"
model = "Qwen/Qwen3-VL-2B-Instruct"
revision = "89644892e4d85e24eaac8bacfd4f463576704203"
train = ["--preset", "grpo_2b_main", "--datasets", "chartqa", "--max-steps", "300",
         "--rollout-lora", "--hardware", "24gb", "--save-steps", "100", "--no-dev-eval",
         "--no-wandb"]
runs = "runs/knobs-chartqa"
records = "runs/knobs-chartqa/records"
baseline = { adapter = "runs/chartqa-pilot-20261007/grpo2-base/checkpoints", change = "pilot Instruct → GRPO: lr 1e-5, 4 questions × 8 samples, token-level loss, 640-token cap, no KL" }

[[knobs.chartqa.knob]]
name = "repeat"
change = "the baseline again, same seed"
flags = []
expect = "the noise floor: GPU kernels make same-seed runs differ"

[[knobs.chartqa.knob]]
name = "loss-grpo"
change = "average each response's token losses first (loss_type grpo)"
flags = ["--loss-type", "grpo"]
expect = "0 or −, longer responses: a long wrong answer is penalized less per token"

[[knobs.chartqa.knob]]
name = "length-1024"
change = "1,024-token response cap (4 completions per micro-batch, same 32 per update)"
flags = ["--max-completion-length", "1024", "--batch-size", "4", "--grad-accum", "8"]
expect = "small +, longer responses: 4.7% of pilot responses hit the 640 cap and score 0"

[[knobs.chartqa.knob]]
name = "scale-none"
change = "advantages not divided by the group's reward spread (Dr. GRPO)"
flags = ["--scale-rewards", "none"]
expect = "about 0"

[[knobs.chartqa.knob]]
name = "kl-0.04"
change = "KL penalty 0.04 to the starting model (original GRPO)"
flags = ["--kl-beta", "0.04"]
expect = "slight − at 300 updates: the penalty slows learning"

[[knobs.chartqa.knob]]
name = "loss-dr-grpo"
change = "token losses divided by a fixed constant (loss_type dr_grpo)"
flags = ["--loss-type", "dr_grpo"]
expect = "− at 300 updates: dividing by the 640-token cap instead of ~200 written tokens shrinks each step about 3×"

# Batch 2 (2026-10-08), from the overfitting check: right answers the reward scored 0, and
# chart values misread at the 608-pixel training canvas. The canvas knob runs only if the
# resolution check (Instruct 2B on dev, original images vs canvas) shows the canvas costs.
[[knobs.chartqa.knob]]
name = "reward-lists"
change = "list-aware ChartQA reward: Unicode dashes as hyphens, bracketed lists as unordered sets"
flags = ["--rewards", "correctness_lists"]
expect = "small +: about 2% of questions have list or dash answers the current reward marks wrong"

[[knobs.chartqa.knob]]
name = "canvas-896"
change = "896-pixel training canvas instead of 608 (784 vision tokens instead of 361; 4 completions per micro-batch)"
flags = ["--canvas-size", "896", "--batch-size", "4", "--grad-accum", "8"]
expect = "+ if the 608 canvas costs accuracy in the resolution check"

# Batch 3 (2026-10-09): show RL the images evaluation sees. The 608 canvas cost Instruct 4.3
# points on ChartQA dev and canvas-896 read +1.04 (within noise); this keeps each chart's shape
# within the evaluation budget instead of padding it onto a square.
[[knobs.chartqa.knob]]
name = "image-budget"
change = "each image kept in shape within the 0.79 MP evaluation budget, no padding (up to 768 vision tokens; 4 completions per micro-batch)"
flags = ["--image-fit", "budget", "--batch-size", "4", "--grad-accum", "8"]
expect = "+, about canvas-896's: same pixels on most charts, no padding tokens"

# Beyond accuracy (2026-10-12), declared with the expected directions before any measurement:
# 1. kl: forward KL from the starting model on the task's own test questions (500 questions, 8
#    samples at T = 1, scripts.kl_to_base). Expected, after RL's Razor: RL below SFT at matched and
#    at full exposure, and the models that moved more forget more on unseen data.
# 2. reliance: accuracy lost with a black and with a swapped image on the task's test set.
#    No direction expected.
# 3. calibration: 8 (or the existing 32) samples at T = 1 per test question; the majority answer
#    and the share of samples agreeing with it, giving its accuracy, expected calibration error and
#    selective accuracy. Expected: RL more confident (its samples agree more, as pass@k showed);
#    no direction expected for calibration error.
# Every listed model of a set is measured; the set's reference is its starting model.
[[beyond_accuracy]]
dataset = "slake"
prompt = "short"
tier = "full"
base = "base2"
models = ["slk-sft2", "slk-short2-base-e1", "slk-short2-sft-e1"]

[[beyond_accuracy]]
