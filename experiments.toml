# The experiment matrix: every arm the report shows, declared once, and the protocols each
# arm is evaluated under. Records match arms by label. `python -m scripts.report` regenerates
# the tables; `--check` lists every declared cell without a record.
# Named matrices below choose which arms a set of tables shows and which pairs they compare.
# The corrected campaign's image-intervention records (first 128 questions) predate the
# tiers and are reported without being declared here.

