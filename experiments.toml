name = "SFT 2B (DeepTumorVQA free form)"
model = "checkpoints/merged/dtff_sft2"

[[arms]]
label = "dtff-blind-sft2"
name = "SFT 2B on black images (DeepTumorVQA free form)"
model = "checkpoints/merged/dtff_blind_sft2"

[[arms]]
label = "m3d-blind-sft2"
name = "SFT 2B on black images (M3D-VQA questions)"
model = "checkpoints/merged/m3d_blind_sft2"

[[arms]]
label = "dtvv-probe-sft2"
name = "SFT 2B probe (debiased DeepTumorVQA, 32-slice grid)"
model = "checkpoints/merged/dtvv_probe_sft2"

# RL against SFT (2026-11-01): the grid probe scored 36.6% against the montage probe's 36.7% on the
