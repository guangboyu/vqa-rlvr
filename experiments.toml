prompt = "short"
tier = "full"
base = "base2"
models = ["omx-sft2-matched", "omx-short2-base", "omx-sft2", "omx-short2-sft"]

[[beyond_accuracy]]
dataset = "vqav2"
prompt = "short"
tier = "first-1000"
base = "base2"
models = ["sft4k2", "p1-f-short2-base", "sft2", "p1-f-short2-sft"]

[[beyond_accuracy]]
dataset = "chartqa"
prompt = "short"
tier = "full"
base = "base2"
