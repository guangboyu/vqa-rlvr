# The matched-question control (2026-10-05): one SFT epoch on exactly the 4,000 questions the
# short-prompt GRPO run from Instruct drew (data/pools/part1-short2-actual4000.json, built by
# scripts/build_draw_pool.py), 125 updates. Trained and evaluated on HPC3; the merged model was
# copied back for the pass@k and OOD cells.
[[arms]]
label = "sft4k2"
name = "SFT on the 4,000 RL questions"
model = "checkpoints/merged/sft4k2_final125"
run = "closeout-sft4k2"

# Short-prompt GRPO from Instruct for one full epoch of the 55,438-question VQAv2 + GQA pool
# (2026-10-07..09): 13,859 updates, each pool question drawn once, otherwise the recipe of
# p1-f-short2-base, which stopped at 1,000 updates (4,000 questions). Free A30s on HPC3,
# 6-hour chained segments; the end-of-epoch adapter is the reported model, chosen in advance.
# Commands: runs/fullpool-20261007/launch.sh and finish.sh (local).
[[arms]]
label = "p1-fp-short2-base"
name = "Instruct → short-prompt GRPO, full pool"
model = "checkpoints/merged/p1_fullpool_short2_base"

# One model on both families (2026-10-09): Instruct 2B -> reasoning-prompt GRPO on the union of
# the questions p1-f-grpo2-base and cqa-grpo2-base-e1 trained on, each drawn once (pool
# mix-chartqa-vqa4k, 2,844 updates). Does it learn when to reason? Commands:
# runs/mix-20261009/run.sh (local).
[[arms]]
label = "mix-grpo2-base"
name = "Instruct → GRPO (VQAv2 + GQA + ChartQA)"
model = "checkpoints/merged/mix_grpo2_base"

