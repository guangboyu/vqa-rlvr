# Held-out pass@k (2026-10-06): sampled cells on the first 1,000 test questions of each
# dataset, 32 samples at temperature 1. Each comparison is candidate minus reference under one
# prompt. `python -m scripts.pass_at_k --declared heldout` writes results/passk-heldout.json.
[passk.heldout]
datasets = ["vqav2", "gqa", "textvqa"]
tier = "first-1000"
samples = 32
temperature = 1.0
seed = 42

[[passk.heldout.comparisons]]
prompt = "short"
reference = "base2"
candidates = ["p1-f-short2-base", "sft2", "sft4k2"]

[[passk.heldout.comparisons]]
prompt = "short"
reference = "p1-f-short2-base"
candidates = ["sft4k2", "p1-fp-short2-base"]

[[passk.heldout.comparisons]]
prompt = "short"
reference = "base2"
candidates = ["p1-fp-short2-base"]

[[passk.heldout.comparisons]]
prompt = "short"
reference = "sft2"
candidates = ["p1-f-short2-sft"]

[[passk.heldout.comparisons]]
prompt = "reasoning"
reference = "base2"
candidates = ["p1-f-grpo2-base"]

