# Experiment cards (Milestone 2). One change against a frozen recipe, with the prediction
# committed before the run starts. Cards read dev rows only; test rows stay for reported arms.
[[cards]]
id = "chart-length-control"
node = "open"
question = """Does chart-only GRPO keep its reasoning past update 2,000? The photos + charts model \
collapsed to about 10 tokens between updates 1,750 and 2,000 of 2,844, while the chart-only \
model stopped at 1,844, so mixing and training length are confounded."""
recipe = "v1.0"
baseline = "cqa-grpo2-base-e1"
change = "2,844 updates instead of 1,844 on ChartQA alone: the mixture's horizon and learning-rate schedule"
train = ["--preset", "grpo_2b_main", "--datasets", "chartqa", "--max-steps", "2844",
         "--rollout-lora", "--hardware", "24gb", "--save-steps", "250", "--save-total-limit", "0",
         "--no-wandb"]
predicted = """Holds. End-of-run dev answers stay above half the 1,844-update model's length and dev \
accuracy within 2 points of it: chart questions reward reasoning, and the collapse came from the \
photo questions' pressure toward short answers. Answers keep shortening slowly, as they did from \
198 tokens at update 300 to 162 at 1,844."""
holds_if = "end-of-run dev tokens >= 50% of the baseline's and dev accuracy >= baseline - 2 points"
holds = { min_token_ratio = 0.5, max_accuracy_drop = 2.0 }
baseline_run = "runs/chartqa-epoch-20261007/grpo2-base"
if_holds = "Mixing caused the collapse: run the prompt-routing and ratio cards."
if_not = "Long-run RL instability, not mixing: no ratio cards; the finding becomes when to stop."
status = "null"
why = """Observed: 1,000 more updates leave dev accuracy where it was (75.8) and answers do not collapse. \
They lengthen after update 1,250 (137 to 179 tokens), so the predicted slow shortening was wrong."""
implies = "The collapse comes from mixing, not length. Next: prompt routing and one other ratio. Chart-only training gains nothing past 1,844 updates."

# Traces come from the released models' own samples, never from an RL model: traces from RL would
# need RL to exist, so they could not show whether RL was needed. Sampling is on the rl role only.
# Before the 8B card runs, Instruct 2B and 8B answer the same 500 ChartQA dev questions: it runs only
# if 8B's greedy reasoning accuracy beats 2B's by at least 3 points.
[[cards]]
id = "reasoning-sft-self"
node = "reasoning-pays"
question = "Does SFT on reasoning traces close GRPO's lead on ChartQA, given the same information RL has: the model's own samples and the checker?"
recipe = "v1.0"
baseline = "cqa-grpo2-base-e1"
change = "SFT on one correct reasoning sample per question from Instruct 2B, instead of GRPO"
entry = "train_sft.py"
train = ["--preset", "sft_2b", "--datasets", "chartqa", "--hardware", "24gb", "--save-total-limit", "0",
         "--no-wandb", "--targets-file", "data/traces/chartqa-base2.jsonl", "--max-length", "1536"]
predicted = """Holds. GRPO stays at least 2 points ahead on dev. Correct traces lift SFT above Instruct and keep its reasoning, but one offline pass cannot sharpen the way repeated on-policy updates do."""
holds_if = "SFT on traces ends at least 2 dev points below the chart-only GRPO model"
holds = { max_delta = -2.0 }
baseline_run = "runs/chartqa-epoch-20261007/grpo2-base"
if_holds = "The chart win stands against SFT on reasoning traces."
if_not = "The win comes from the reasoning targets rather than from RL, and the root claim changes."
status = "experimental"

[[cards]]
id = "reasoning-sft-8b"
node = "reasoning-pays"
question = "Does SFT on a larger model's reasoning traces close GRPO's lead on ChartQA?"
recipe = "v1.0"
baseline = "cqa-grpo2-base-e1"
change = "SFT on one correct reasoning sample per question from Instruct 8B, instead of GRPO"
entry = "train_sft.py"
train = ["--preset", "sft_2b", "--datasets", "chartqa", "--hardware", "24gb", "--save-total-limit", "0",
         "--no-wandb", "--targets-file", "data/traces/chartqa-base8.jsonl", "--max-length", "1536"]
predicted = """Holds. GRPO stays at least 2 points ahead on dev, with this arm at or above SFT on 2B's traces: a stronger teacher improves the targets, and the student still gets one offline pass."""
holds_if = "SFT on 8B traces ends at least 2 dev points below the chart-only GRPO model"
holds = { max_delta = -2.0 }
